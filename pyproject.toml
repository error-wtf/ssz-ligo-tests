[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssz-ligo-tests"
version = "0.1.0"
description = "SSZ-LIGO Forward Model Test Suite"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "mypy",
    "pytest-xdist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: Unit tests for individual functions",
    "integration: Integration tests for full chain",
    "validation: Validation against SSZ canonical sources",
    "anti_circularity: Tests for anti-circularity compliance",
    "slow: Slow tests that may be skipped",
    "corpus: Corpus data tests",
]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/ssz_ligo_tests"]
omit = ["*/tests/*", "*/test_*"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
